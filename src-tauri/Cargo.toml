[package]
name = "blendstack"
version = "0.1.0"
description = "A fast, modern launcher for official Blender builds"
authors = ["Max Derksen"]
license = "MIT"
repository = "https://github.com/ilumetric/BlendStack"
edition = "2021"
rust-version = "1.85"

[lib]
name = "blendstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
log = "0.4.34"
png = "0.18.1"
quick-xml = "0.41.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "stream", "json", "gzip", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
bzip2 = "0.5.2"
tar = "0.4.46"
xz2 = "0.1.7"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
windows-version = "0.1.7"

name: Release

# Two ways to publish a release:
#   • Actions → Release → Run workflow, pick patch / minor / major.
#     The version is bumped in every file, committed, tagged and released.
#   • Push a tag like `v1.2.3` whose version matches the files.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Bump or verify the version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V=$(node scripts/version.mjs "${{ inputs.bump }}")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$V"
            git tag "v$V"
            git push origin "HEAD:${{ github.ref_name }}" "v$V"
          else
            V="${GITHUB_REF_NAME#v}"
            node scripts/version.mjs check "$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Windows: one self-contained executable. Settings, cache and Blender
      # builds are stored next to it, so the zip is all a user needs.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx tauri build --no-bundle
          New-Item -ItemType Directory -Force "out/Blend Stack" | Out-Null
          Copy-Item src-tauri/target/release/blendstack.exe "out/Blend Stack/Blend Stack.exe"
          New-Item -ItemType Directory -Force upload | Out-Null
          Compress-Archive -Path "out/Blend Stack" -DestinationPath "upload/BlendStack-$env:VERSION-windows-x64.zip"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --target universal-apple-darwin --bundles dmg
          mkdir -p upload
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "upload/BlendStack-$VERSION-macos-universal.dmg"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npx tauri build --bundles appimage,deb
          mkdir -p upload
          cp src-tauri/target/release/bundle/appimage/*.AppImage "upload/BlendStack-$VERSION-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "upload/BlendStack-$VERSION-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: upload/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Blend Stack $VERSION" \
            --generate-notes \
            --verify-tag
